name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'api/**'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths-ignore:
      - 'api/**'
      - 'docs/**'

# Serialize deploys so two pushes to master in quick succession can't run
# concurrently and finish out of order (last finisher wins otherwise).
# NOTE: the deploy step below is correctly guarded with
# `if: github.event_name == 'push'` — keep it that way. Do NOT add a
# `deploy --env <name>` step for PR previews: with @cloudflare/vite-plugin the
# --env flag is silently ignored (it is only asserted against a build-time
# CLOUDFLARE_ENV) and the deploy lands on PRODUCTION. horizon-frontend shipped
# every PR to production for months that way. Use `versions upload` instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The TanStack Start SSR build is memory-heavy; raise Node's heap limit so
      # the GitHub-hosted runner doesn't OOM (FATAL heap OOM, exit 134) during
      # `vite build`. Runner has 16 GB; 6 GB old-space is safe and sufficient.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: no build-time sitemap generation — starthn serves the sitemap
      # dynamically from the Worker (src/server/sitemap.ts). Generating static
      # public/sitemap*.xml here would shadow the dynamic one (Workers Assets
      # are served before the Worker).

      # .env.production is committed — Vite auto-loads it during production builds.
      - name: Build
        run: npm run build

      # Deploy only on push to master. PRs run build above as a validation check.
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 14e66a44c223436e076dbd6073c78d98
